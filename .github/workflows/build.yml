name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out pinned MeshCore
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: 75b04ef06def54b348400cb1b138afb6749ffd4f
          path: meshcore

      - name: Run host decoder tests
        run: ./scripts/test.sh

      - name: Test portal manifest generator
        run: node tests/test_manifest.mjs

      - name: Prepare firmware overlay
        run: |
          git -C meshcore apply "$GITHUB_WORKSPACE/patches/meshcore-sensor-hooks.patch"
          cp -R firmware meshcore/firmware
          cp config/platformio.local.ini meshcore/platformio.local.ini

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==6.1.18

      - name: Build RAK4631 firmware
        run: pio run -d meshcore -e RAK_4631_victron_sensor

      - name: Create and verify UF2
        run: |
          python meshcore/bin/uf2conv/uf2conv.py \
            -f 0xADA52840 \
            -c meshcore/.pio/build/RAK_4631_victron_sensor/firmware.hex \
            -o meshcore/.pio/build/RAK_4631_victron_sensor/firmware.uf2
          python meshcore/bin/uf2conv/uf2conv.py \
            -i meshcore/.pio/build/RAK_4631_victron_sensor/firmware.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAK4631-Victron-Ruuvi-Shelly-BLE
          path: |
            meshcore/.pio/build/RAK_4631_victron_sensor/firmware.zip
            meshcore/.pio/build/RAK_4631_victron_sensor/firmware.uf2
            meshcore/.pio/build/RAK_4631_victron_sensor/firmware.hex
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Download verified firmware
        uses: actions/download-artifact@v4
        with:
          name: RAK4631-Victron-Ruuvi-Shelly-BLE
          path: release-files

      - name: Give release assets versioned names
        run: |
          mv release-files/firmware.uf2 "release-files/RAK4631-BLE-Sensor-${GITHUB_REF_NAME}.uf2"
          mv release-files/firmware.zip "release-files/RAK4631-BLE-Sensor-${GITHUB_REF_NAME}.zip"
          mv release-files/firmware.hex "release-files/RAK4631-BLE-Sensor-${GITHUB_REF_NAME}.hex"

      - name: Generate portal manifest
        run: |
          node scripts/generate-portal-manifest.mjs \
            --targets portal/targets.json \
            --artifacts release-files \
            --output release-files/portal-manifest.json \
            --version "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --firmware-config config/platformio.local.ini

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Notify Sensor Portal
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${PORTAL_DISPATCH_TOKEN:-}" ]]; then
            echo "::notice::PORTAL_DISPATCH_TOKEN is not configured; the portal will update on its nightly schedule."
            exit 0
          fi
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{event_type:"firmware_released",client_payload:{tag:$tag,repository:$repository}}' \
            | GH_TOKEN="$PORTAL_DISPATCH_TOKEN" gh api \
                --method POST \
                "repos/roaridse/MeshCore-Sensor-Portal/dispatches" \
                --input -
