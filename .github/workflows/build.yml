name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out pinned MeshCore
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: 75b04ef06def54b348400cb1b138afb6749ffd4f
          path: meshcore

      - name: Run host decoder tests
        run: ./scripts/test.sh

      - name: Prepare firmware overlay
        run: |
          git -C meshcore apply "$GITHUB_WORKSPACE/patches/meshcore-sensor-hooks.patch"
          cp -R firmware meshcore/firmware
          cp config/platformio.local.ini meshcore/platformio.local.ini

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==6.1.18

      - name: Build RAK4631 firmware
        run: pio run -d meshcore -e RAK_4631_victron_sensor

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAK4631-Victron-Ruuvi-BLE
          path: |
            meshcore/.pio/build/RAK_4631_victron_sensor/firmware.zip
            meshcore/.pio/build/RAK_4631_victron_sensor/firmware.uf2
            meshcore/.pio/build/RAK_4631_victron_sensor/firmware.hex
          if-no-files-found: error
