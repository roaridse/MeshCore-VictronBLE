name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Run host decoder tests
        run: ./scripts/test.sh

      - name: Test portal manifest generator
        run: node tests/test_manifest.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: rak4631
            environment: RAK_4631_victron_sensor
            artifact_base: RAK4631-BLE-Sensor
          - id: heltec-t114
            environment: Heltec_T114_victron_sensor
            artifact_base: Heltec-T114-BLE-Sensor
          - id: rak-wismesh-tag
            environment: RAK_WisMesh_Tag_victron_sensor
            artifact_base: WisMesh-Tag-BLE-Sensor
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out pinned MeshCore
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: 75b04ef06def54b348400cb1b138afb6749ffd4f
          path: meshcore

      - name: Prepare firmware overlay
        run: |
          git -C meshcore apply "$GITHUB_WORKSPACE/patches/meshcore-sensor-hooks.patch"
          cp -R firmware meshcore/firmware
          cp config/platformio.local.ini meshcore/platformio.local.ini

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==6.1.18

      - name: Build ${{ matrix.target.id }} firmware
        run: pio run -d meshcore -e "${{ matrix.target.environment }}"

      - name: Create and verify UF2
        run: |
          python meshcore/bin/uf2conv/uf2conv.py \
            -f 0xADA52840 \
            -c "meshcore/.pio/build/${{ matrix.target.environment }}/firmware.hex" \
            -o "meshcore/.pio/build/${{ matrix.target.environment }}/firmware.uf2"
          python meshcore/bin/uf2conv/uf2conv.py \
            -i "meshcore/.pio/build/${{ matrix.target.environment }}/firmware.uf2"

      - name: Stage release files
        run: |
          mkdir -p release-files
          cp "meshcore/.pio/build/${{ matrix.target.environment }}/firmware.uf2" \
            "release-files/${{ matrix.target.artifact_base }}.uf2"
          cp "meshcore/.pio/build/${{ matrix.target.environment }}/firmware.zip" \
            "release-files/${{ matrix.target.artifact_base }}.zip"
          cp "meshcore/.pio/build/${{ matrix.target.environment }}/firmware.hex" \
            "release-files/${{ matrix.target.artifact_base }}.hex"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target.id }}
          path: release-files
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Download verified firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: release-files

      - name: Give release assets versioned names
        run: |
          for source in release-files/*; do
            extension="${source##*.}"
            stem="${source%.*}"
            mv "$source" "${stem}-${GITHUB_REF_NAME}.${extension}"
          done

      - name: Generate portal manifest
        run: |
          node scripts/generate-portal-manifest.mjs \
            --targets portal/targets.json \
            --artifacts release-files \
            --output release-files/portal-manifest.json \
            --version "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --firmware-config config/platformio.local.ini

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Notify Sensor Portal
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${PORTAL_DISPATCH_TOKEN:-}" ]]; then
            echo "::notice::PORTAL_DISPATCH_TOKEN is not configured; the portal will update on its nightly schedule."
            exit 0
          fi
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{event_type:"firmware_released",client_payload:{tag:$tag,repository:$repository}}' \
            | GH_TOKEN="$PORTAL_DISPATCH_TOKEN" gh api \
                --method POST \
                "repos/roaridse/MeshCore-Sensor-Portal/dispatches" \
                --input -
