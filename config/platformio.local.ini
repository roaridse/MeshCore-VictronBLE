[ble_sensor_base]
build_flags =
  -I examples/simple_sensor
  -I firmware/victron
  -I firmware/ruuvi
  -I firmware/shelly
  -D ADVERT_NAME='"BLE Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"change-me"'
  -D SENSOR_READ_INTERVAL_SECS=60
  -D FIRMWARE_VERSION='"v0.5.0"'
  -D FIRMWARE_BUILD_DATE=__DATE__
build_src_filter =
  +<../examples/simple_sensor/SensorMesh.cpp>
  +<../examples/simple_sensor/TimeSeriesData.cpp>
  +<../firmware/main.cpp>
  +<../firmware/victron/*.cpp>
  +<../firmware/ruuvi/*.cpp>
  +<../firmware/shelly/*.cpp>

[env:RAK_4631_victron_sensor]
extends = rak4631
build_flags =
  ${rak4631.build_flags}
  ${ble_sensor_base.build_flags}
build_src_filter =
  ${rak4631.build_src_filter}
  ${ble_sensor_base.build_src_filter}

[env:Heltec_T114_victron_sensor]
extends = Heltec_t114
build_flags =
  ${Heltec_t114.build_flags}
  ${ble_sensor_base.build_flags}
build_src_filter =
  ${Heltec_t114.build_src_filter}
  ${ble_sensor_base.build_src_filter}

[env:RAK_WisMesh_Tag_victron_sensor]
extends = rak_wismesh_tag
build_flags =
  ${rak_wismesh_tag.build_flags}
  ${ble_sensor_base.build_flags}
build_src_filter =
  ${rak_wismesh_tag.build_src_filter}
  ${ble_sensor_base.build_src_filter}
